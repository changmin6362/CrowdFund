# Spring Boot로 작성된 백엔드 프로젝트를 Docker를 사용해서 Amazon EC2에 배포하는 동작을 수행하는 Github Action
name: Spring Boot CI/CD with Docker and Amazon EC2

on: # 이벤트 감지
  pull_request:
    branches: [ "master" ] # master 브랜치에서만 감지
    types: [ closed ] # PR이 닫혔을 때 실행

jobs:
  deploy:
    # PR이 'merge' 되었을 때만 실행되도록 조건 설정
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Java 실행 환경 설정
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Gradle 빌드 (테스트 제외하고 jar 파일 생성)
    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew clean build -x test

    # 3. Docker Hub 로그인
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Docker 이미지 빌드 및 도커 허브에 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 이미지명 뒤에 latest 태그를 붙여 항상 최신 상태로 업로드
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-spring-app:latest

    # 5. EC2에 SSH로 원격 접속하여 최신 이미지 다운로드 및 실행
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
        script: |
          # EC2 내부에서 도커 허브 로그인 실행
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          
          # 1. 기존에 실행 중이던 컨테이너 중지 및 삭제
          docker stop my-spring-app || true
          docker rm my-spring-app || true
          
          # 2. 도커 허브에서 최신 이미지 가져오기
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-spring-app:latest
          
          # 3. 사용하지 않는 오래된 도커 이미지 정리 (용량 확보)
          docker image prune -f
          
          # 4. 새 컨테이너 실행 (EC2 80포트와 스프링 8080포트 연결)
          docker run -d -p 80:8080 --name my-spring-app ${{ secrets.DOCKERHUB_USERNAME }}/my-spring-app:latest
