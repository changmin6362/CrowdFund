<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>프로젝트 목록</h1>
    
    <div th:if="${errorMessage}" class="error-msg">
        <p th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{/projects}" method="get">
        <label>카테고리 ID:</label>
        <input type="number" name="categoryId" th:value="${categoryId}" placeholder="카테고리 ID 입력"/>
        
        <label>상태:</label>
        <div th:each="status : ${T(io.github.crowdfund.domain.project.ProjectStatus).values()}">
            <input type="checkbox" name="statuses" th:value="${status}" 
                   th:checked="${statuses != null && statuses.contains(status)}"/>
            <label th:text="${status}"></label>
        </div>
        
        <button type="submit">검색</button>
    </form>

    <hr/>

    <div th:if="${projectData != null and #lists.isEmpty(projectData.projects)}">
        <p>조회된 프로젝트가 없습니다.</p>
    </div>

    <div th:if="${projectData != null}">
        <div th:each="p : ${projectData.projects}" class="project-card">
            <div class="project-title" th:text="${p.title}">제목</div>
            <p>창작자: <span th:text="${p.creatorNickname}">닉네임</span></p>
            <p>목표 금액: <span th:text="${p.goalAmount}">0</span>원</p>
            <p>현재 금액: <span th:text="${p.currentAmount}">0</span>원</p>
            <p>상태: <span th:text="${p.status}">상태</span></p>
            <a th:href="@{/projects/{id}(id=${p.projectId})}">상세보기</a>
        </div>

        <div th:if="${projectData.hasNext}">
            <a th:href="@{/projects(statuses=${statuses}, categoryId=${categoryId}, createdAt=${projectData.nextCursor.createdAt}, id=${projectData.nextCursor.id})}">다음 페이지</a>
        </div>
    </div>

    <p><a th:href="@{/}">홈으로</a></p>
    </div>
</body>
</html>
