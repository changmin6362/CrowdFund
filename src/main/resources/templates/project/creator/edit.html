<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>프로젝트 수정</h1>

    <form th:action="@{/creator/projects/{id}/update(id=${projectId})}" th:object="${updateRequest}" method="post">
        <div>
            <label>새 제목:</label>
            <input type="text" th:field="*{title}" required/>
        </div>
        <div>
            <label>새 본문 내용(JSON):</label>
            <textarea th:field="*{contentBlocks}" required></textarea>
        </div>
        <button type="submit">수정하기</button>
    </form>

    <p><a th:href="@{/creator/projects/me}">목록으로</a></p>
    </div>
</body>
</html>
