<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>후원 상세 정보 (창작자용)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>후원 상세 관리</h1>

        <div class="info-box">
            <h3>👤 후원자 정보</h3>
            <p><strong>이름:</strong> <span th:text="${pledge.userName}"></span></p>
            <p><strong>이메일:</strong> <span th:text="${pledge.email}"></span></p>
            <p><strong>연락처:</strong> <span th:text="${pledge.phoneNumber}"></span></p>
        </div>

        <div class="info-box">
            <h3>🎁 리워드 정보</h3>
            <p><strong>리워드 제목:</strong> <span th:text="${pledge.rewardTitle}"></span></p>
            <p><strong>후원 금액:</strong> <span th:text="${pledge.pledgeAmount}"></span>원</p>
        </div>

        <div class="info-box">
            <h3>🚚 이행 상태 관리</h3>
            <p>현재 상태: 
                <span th:class="'status-badge status-' + ${pledge.fulfillmentStatus}" 
                      th:text="${pledge.fulfillmentStatus}"></span>
            </p>
            
            <form th:action="@{/creator/pledges/{id}/fulfill(id=${pledge.pledgeId})}" th:object="${fulfillRequest}" method="post" style="margin-top: 15px;">
                <label for="fulfillmentStatus">상태 변경:</label>
                <select th:field="*{fulfillmentStatus}" id="fulfillmentStatus">
                    <option value="READY">READY (준비 중)</option>
                    <option value="FULFILLED">FULFILLED (이행 완료)</option>
                </select>
                <button type="submit">변경 적용</button>
            </form>
        </div>

        <p><a th:href="@{/creator/projects/{id}/shipping(id=${pledge.projectId})}">← 배송지 목록으로 돌아가기</a></p>
    </div>
</body>
</html>
