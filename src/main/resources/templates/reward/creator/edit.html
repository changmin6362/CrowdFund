<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>리워드 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>리워드 수정</h1>
    <p>프로젝트 ID: <span th:text="${projectId}"></span></p>
    <p>리워드 ID: <span th:text="${rewardId}"></span></p>

    <form th:action="@{/creator/projects/{projectId}/rewards/{rewardId}/update(projectId=${projectId}, rewardId=${rewardId})}" th:object="${updateRequest}" method="post">
        <div>
            <label>제목:</label>
            <input type="text" th:field="*{title}" required/>
        </div>
        <div>
            <label>설명:</label>
            <textarea th:field="*{description}" required></textarea>
        </div>
        <div>
            <label>가격:</label>
            <input type="number" th:field="*{price}" required/>
        </div>
        <button type="submit">수정</button>
    </form>

    <hr/>

    <h2>재고 수정</h2>
    <form th:action="@{/creator/projects/{projectId}/rewards/{rewardId}/stock(projectId=${projectId}, rewardId=${rewardId})}" th:object="${stockRequest}" method="post">
        <div>
            <label>재고:</label>
            <input type="number" th:field="*{stock}" required/>
        </div>
        <button type="submit">재고 수정</button>
    </form>

    <p><a th:href="@{/creator/projects/{projectId}/rewards(projectId=${projectId})}">리워드 관리로 돌아가기</a></p>
    </div>
</body>
</html>
