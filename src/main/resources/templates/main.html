<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CrowdFund Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>CrowdFund</h1>

<div sec:authorize="isAuthenticated()" class="user-info">
    <p><strong><span sec:authentication="name">사용자</span></strong>님 환영합니다!
        <span sec:authorize="${#authentication.principal.getClass().getSimpleName() == 'SecurityUser'}">
               (닉네임: <span sec:authentication="principal.nickname">닉네임</span>)
        </span>
        <span sec:authorize="hasRole('ADMIN')" style="color: #dc3545; font-weight: bold;">[관리자 계정]</span>
    </p>
    <form th:action="@{/auth/logout}" method="post">
        <button type="submit">로그아웃</button>
    </form>
</div>

<div th:if="${param.error}" class="error-msg">
    <p th:if="${param.error[0] == 'forbidden'}">해당 페이지에 접근할 권한이 없습니다.</p>
</div>

<h2>서비스 메뉴</h2>
<ul>
    <li sec:authorize="isAnonymous()"><a th:href="@{/auth/login}">로그인</a></li>
    <li sec:authorize="isAnonymous()"><a th:href="@{/auth/signup}">회원가입</a></li>
    <li sec:authorize="isAuthenticated()"><a th:href="@{/users/me}">내 정보 관리</a></li>
    <li sec:authorize="isAuthenticated()"><a th:href="@{/pledges/me}">내 후원 목록</a></li>
    <li sec:authorize="isAuthenticated()"><a th:href="@{/creator/projects/me}">내 프로젝트 관리</a></li>
    <li><a th:href="@{/projects}">프로젝트 탐색</a></li>
    <li><a th:href="@{/categories}">카테고리 목록</a></li>
</ul>

<hr/>

<div sec:authorize="hasRole('ADMIN')">
    <h2>관리자 메뉴</h2>

    <ul>
        <li><a th:href="@{/admin/categories}" class="admin-link">카테고리 관리</a></li>
        <li><a th:href="@{/admin/pledges}" class="admin-link">전체 후원 관리</a></li>
    </ul>
    <hr/>
</div>
</body>
</html>
