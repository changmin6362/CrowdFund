<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 정보 관리</title>
    <style>
        .error { color: red; font-size: 0.8em; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>내 정보 관리</h1>

    <div th:if="${param.success}" class="success">
        성공적으로 수정되었습니다.
    </div>

    <div>
        <h3>기본 정보</h3>
        <p>이메일: <span th:text="${user.email}"></span></p>
        <p>역할: <span th:text="${user.role}"></span></p>
    </div>

    <hr/>

    <div>
        <h3>정보 수정</h3>
        <form th:action="@{/users/me/update}" th:object="${updateRequest}" method="post">
            <div>
                <label>닉네임:</label>
                <input type="text" th:field="*{nickname}"/>
                <p th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="error"></p>
            </div>
            <div>
                <label>이름:</label>
                <input type="text" th:field="*{name}"/>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></p>
            </div>
            <div>
                <label>전화번호:</label>
                <input type="text" th:field="*{phone}" placeholder="010-1234-5678"/>
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></p>
            </div>
            <button type="submit">수정하기</button>
        </form>
    </div>

    <hr/>

    <div style="margin-top: 50px;">
        <h3>회원 탈퇴</h3>
        <p>탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.</p>
        <form th:action="@{/users/me/delete}" method="post" onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
            <button type="submit" style="color: red;">회원 탈퇴하기</button>
        </form>
    </div>

    <p><a th:href="@{/}">홈으로</a></p>
</body>
</html>
