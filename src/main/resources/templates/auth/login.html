<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        .error { color: red; }
    </style>
</head>
<body>
    <h1>로그인</h1>
    <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
        <div>
            <label>이메일:</label>
            <input type="text" th:field="*{email}" placeholder="example@email.com" />
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></p>
        </div>
        <div>
            <label>비밀번호:</label>
            <input type="password" th:field="*{password}" />
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></p>
        </div>
        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>
        <button type="submit">로그인</button>
    </form>
    <p>계정이 없으신가요? <a th:href="@{/auth/signup}">회원가입</a></p>
</body>
</html>
