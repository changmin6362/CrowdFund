<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 후원 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>후원 상세 정보 (관리자)</h1>

        <div class="info-box">
            <h3>기본 정보</h3>
            <p>후원 ID: <span th:text="${pledge.pledgeId}"></span></p>
            <p>상태: <span th:text="${pledge.status}"></span></p>
            <p>이행 상태: <span th:text="${pledge.fulfillmentStatus}"></span></p>
            <p>생성 일시: <span th:text="${pledge.createdAt}"></span></p>
        </div>

    <hr/>

        <div class="info-box">
            <h3>후원자 정보</h3>
            <p>ID: <span th:text="${pledge.user.userId}"></span></p>
            <p>이름: <span th:text="${pledge.user.name}"></span></p>
            <p>이메일: <span th:text="${pledge.user.email}"></span></p>
        </div>

    <hr/>

        <div class="info-box">
            <h3>프로젝트 정보</h3>
            <p>ID: <span th:text="${pledge.project.projectId}"></span></p>
            <p>제목: <span th:text="${pledge.project.title}"></span></p>
            <p>창작자 ID: <span th:text="${pledge.project.creatorId}"></span></p>
        </div>

    <p><a th:href="@{/admin/pledges}">목록으로</a></p>
    </div>
</body>
</html>
