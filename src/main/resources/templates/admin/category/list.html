<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>카테고리 관리</h1>

    <h2>새 카테고리 추가</h2>
    <form th:action="@{/admin/categories}" th:object="${createRequest}" method="post">
        <div>
            <label>부모 카테고리 ID (없으면 비움):</label>
            <input type="number" th:field="*{parentId}" />
        </div>
        <div>
            <label>카테고리 이름:</label>
            <input type="text" th:field="*{name}" />
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></p>
        </div>
        <button type="submit">생성</button>
    </form>

    <hr/>

    <h2>카테고리 목록</h2>
    <div class="category-tree">
        <ul th:fragment="tree(nodes)">
            <li th:each="node : ${nodes}" class="category-item">
                <span th:text="${node.name} + ' (ID: ' + ${node.categoryId} + ', 순서: ' + ${node.sortOrder} + ')'"></span>
                
                <div class="inline-form">
                    <!-- 이름 변경 -->
                    <form th:action="@{/admin/categories/{id}/rename(id=${node.categoryId})}" method="post" style="display: inline;">
                        <input type="text" name="name" placeholder="새 이름" required style="width: 150px;"/>
                        <button type="submit">이름변경</button>
                    </form>

                    <!-- 삭제 -->
                    <form th:action="@{/admin/categories/{id}/delete(id=${node.categoryId})}" method="post" style="display: inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <button type="submit" class="danger-button">삭제</button>
                    </form>
                </div>

                <ul th:if="${!#lists.isEmpty(node.children)}">
                    <div th:replace="::tree(${node.children})"></div>
                </ul>
            </li>
        </ul>
        <div th:replace="::tree(${categoryTree})"></div>
    </div>

    <p><a th:href="@{/}">홈으로</a></p>
    </div>
</body>
</html>
